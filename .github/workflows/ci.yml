name: CI

on:
  push:
    paths-ignore:
      - "*.md"
      - "LICENSE"
  pull_request:

jobs:
  build-linux:
    name: Build Linux ${{ matrix.display }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - display: Release (32-bit)
            debug: 0
            cc: gcc -m32
            asset: wibo-i686
          - display: Debug (32-bit)
            debug: 1
            cc: gcc -m32
            asset: wibo-i686-debug
          - display: Release (64-bit)
            debug: 0
            cc: gcc
            liburing: 1
            asset: wibo-x86_64
          - display: Debug (64-bit)
            debug: 1
            cc: gcc
            liburing: 1
            asset: wibo-x86_64-debug
          - display: Release (Win64 runtime)
            debug: 0
            cc: gcc
            win64: 1
            liburing: 1
            asset: wibo-win64
    env:
      DEBUG: ${{ matrix.debug || 0 }}
      CC: ${{ matrix.cc }}
      WIN64: ${{ matrix.win64 || 0 }}
      WIBO_ENABLE_LIBURING: ${{ matrix.liburing || 0 }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            binutils-mingw-w64-i686 \
            binutils-mingw-w64-x86-64 \
            gcc-mingw-w64-i686 \
            gcc-mingw-w64-x86-64 \
            gcc-multilib \
            libc6-dev-i386 \
            liburing-dev \
            make

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build wibo
        run: make WIBO_VERSION="$(git describe --tags --always)"

      - name: Tests
        run: make test

      - name: Bundle tests
        run: make test-bundle

      - name: Stage artifact
        run: |
          mkdir -p dist
          cp "$(make -s print-wibo)" "dist/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  build-macos:
    name: Build macOS ${{ matrix.display }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            display: Debug
            debug: 1
            asset: wibo-macos-debug
          - os: macos-latest
            display: Release
            debug: 0
            asset: wibo-macos
          # For testing only
          - os: macos-15-intel
            display: Release (Intel)
            debug: 0
    steps:
      - name: Install dependencies
        run: |
          brew install mingw-w64

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build wibo
        run: make DEBUG=${{ matrix.debug }}

      - name: Tests
        run: make DEBUG=${{ matrix.debug }} test

      - name: Stage artifact
        if: ${{ matrix.asset }}
        run: |
          mkdir -p dist
          cp "$(make -s print-wibo DEBUG=${{ matrix.debug }})" "dist/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        if: ${{ matrix.asset }}
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: wibo-*
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          generate_release_notes: true
